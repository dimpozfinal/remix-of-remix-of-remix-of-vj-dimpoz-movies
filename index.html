  <body>
    <style>
      #initial-splash{position:fixed;inset:0;background:#141414;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#fff;transition:opacity .3s ease}
      #initial-splash.hide{opacity:0;pointer-events:none}
      #initial-splash .brand{font-weight:900;letter-spacing:.15em;font-size:22px;color:#4ADE80;margin-bottom:18px}
      #initial-splash .ring{width:44px;height:44px;border:3px solid rgba(255,255,255,.15);border-top-color:#4ADE80;border-radius:50%;animation:sp 1s linear infinite}
      #initial-splash .msg{margin-top:16px;font-size:12px;color:#B3B3B3;text-align:center;max-width:280px;padding:0 20px;min-height:16px}
      @keyframes sp{to{transform:rotate(360deg)}}
    </style>
    <div id="initial-splash" role="status" aria-label="Loading LUO CINEMA">
      <div class="brand">LUO CINEMA</div>
      <div class="ring"></div>
      <div class="msg" id="initial-splash-msg"></div>
    </div>
    <script>
      // Show a helpful message if the app is slow to boot (weak WiFi/3G)
      (function(){
        var msg=document.getElementById('initial-splash-msg');
        var t1=setTimeout(function(){if(msg)msg.textContent='Still loading… check your connection.';},6000);
        var t2=setTimeout(function(){if(msg)msg.innerHTML='Slow connection detected. <a href="javascript:location.reload()" style="color:#4ADE80;text-decoration:underline">Tap to retry</a>.';},15000);
        window.__hideSplash=function(){
          clearTimeout(t1);clearTimeout(t2);
          var el=document.getElementById('initial-splash');
          if(!el)return;el.classList.add('hide');setTimeout(function(){el&&el.remove();},350);
        };
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
